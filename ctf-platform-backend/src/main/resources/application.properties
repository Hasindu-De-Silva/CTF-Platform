# --- Database ---
# Create the database first: CREATE DATABASE ctf_playbox;
spring.datasource.url=jdbc:mysql://localhost:3306/ctf_playbox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables from the entities - fine for coursework, not for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- Session ---
server.servlet.session.timeout=30m
