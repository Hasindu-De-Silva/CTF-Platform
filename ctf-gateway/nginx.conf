events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Upstream to Stage 4 Web Gateway on isolated ctf-net-web
    upstream stage4_backend {
        server ctf-target-stage4:8081;
    }

    # Upstream to Stage 8 Capstone Web Terminal on isolated ctf-net-linux
    upstream stage8_web_backend {
        server ctf-target-stage8:8086;
    }

    # Server block for Stage 4 Gateway (Port 8081)
    server {
        listen 8081;
        server_name localhost;

        location / {
            proxy_pass http://stage4_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block for Stage 8 Capstone Web Terminal (Port 8086)
    server {
        listen 8086;
        server_name localhost;

        location / {
            proxy_pass http://stage8_web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

# Stream block for Stage 8 SSH forwarding (Port 2222)
stream {
    upstream stage8_ssh_backend {
        server ctf-target-stage8:22;
    }

    server {
        listen 2222;
        proxy_pass stage8_ssh_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
